name: Bug report
description: Report broken behavior or an incorrect scanner result.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Patchwise. Remove secrets from every example.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Scanner rule
        - Verified fix
        - Lessons
        - Interface
        - API
        - Documentation
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include the smallest safe snippet that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, personal data, and proprietary code from the report.
          required: true
